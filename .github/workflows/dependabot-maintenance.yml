name: Dependabot Maintenance

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Command to comment on PRs (recreate or rebase)"
        type: choice
        required: true
        options:
          - recreate
          - rebase
      rerun_workflows:
        description: "Re-run failed or pending workflow runs on dependabot branches"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comment on Dependabot PRs and re-run workflows
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const action = core.getInput('action')
            const rerun = core.getInput('rerun_workflows') === 'true'

            // List open PRs by Dependabot
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open' })
            const dependabotPRs = prs.filter(pr => pr.user && (pr.user.login === 'dependabot[bot]' || pr.user.type === 'Bot'))

            core.info(`Found ${dependabotPRs.length} Dependabot PRs`)
            for (const pr of dependabotPRs) {
              // Leave command comment
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: `@dependabot ${action}` })
              core.info(`Commented @dependabot ${action} on PR #${pr.number}`)

              if (rerun) {
                // Re-run latest workflow runs for this head branch
                const branch = pr.head.ref
                const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, { owner, repo, branch, per_page: 50 })
                const targets = runs.filter(r => r.event === 'pull_request' && (r.status !== 'completed' || (r.conclusion && r.conclusion !== 'success')))
                for (const r of targets.slice(0, 5)) {
                  await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun', { owner, repo, run_id: r.id })
                  core.info(`Re-ran workflow run ${r.id} (${r.name}) for branch ${branch}`)
                }
              }
            }
            if (dependabotPRs.length === 0) {
              core.info('No Dependabot PRs open')
            }
