name: Enable Auto-Merge for Dependabot PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  pull-requests: write
  contents: write

jobs:
  enable:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-latest
    env:
      DEPENDABOT_AUTOMERGE_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
    steps:
      - name: Token path (diagnostic)
        if: ${{ steps.patcheck.outputs.valid == 'true' }}
        run: echo "Using DEPENDABOT_AUTOMERGE_TOKEN (PAT) for auto-merge"
      - name: Token path (diagnostic fallback)
        if: ${{ steps.patcheck.outputs.valid != 'true' }}
        run: echo "Using GITHUB_TOKEN for auto-merge"
      - name: Validate PAT
        id: patcheck
        shell: bash
        run: |
          if [ -n "$DEPENDABOT_AUTOMERGE_TOKEN" ]; then
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $DEPENDABOT_AUTOMERGE_TOKEN" https://api.github.com/user)
            if [ "$code" = "200" ]; then
              echo "valid=true" >> "$GITHUB_OUTPUT"
            else
              echo "valid=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check PR checks status
        id: checks
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha
            const res = await github.rest.checks.listForRef({ owner: context.repo.owner, repo: context.repo.repo, ref: sha })
            const failing = res.data.check_runs.filter(cr => ['failure','cancelled','timed_out','action_required'].includes(cr.conclusion))
            core.setOutput('ok', failing.length === 0 ? 'true' : 'false')

      - name: Wait until checks are successful
        id: waitchecks
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const sha = context.payload.pull_request.head.sha
            const maxTries = 60
            for (let i = 0; i < maxTries; i++) {
              const res = await github.rest.checks.listForRef({ owner, repo, ref: sha })
              const runs = res.data.check_runs
              const failed = runs.filter(cr => ['failure','cancelled','timed_out','action_required'].includes(cr.conclusion))
              if (failed.length > 0) {
                core.setFailed('Required checks failing')
                return
              }
              const pending = runs.filter(cr => cr.status !== 'completed')
              if (pending.length === 0) {
                core.setOutput('ready', 'true')
                return
              }
              await new Promise(r => setTimeout(r, 20000))
            }
            core.setFailed('Timeout waiting for checks to complete')

      - name: Enable Auto-Merge (PAT)
        if: ${{ steps.waitchecks.outputs.ready == 'true' && steps.patcheck.outputs.valid == 'true' }}
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ env.DEPENDABOT_AUTOMERGE_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash

      - name: Enable Auto-Merge (GITHUB_TOKEN)
        if: ${{ steps.waitchecks.outputs.ready == 'true' && steps.patcheck.outputs.valid != 'true' }}
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
