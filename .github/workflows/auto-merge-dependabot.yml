name: Enable Auto-Merge for Dependabot PRs

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  pull-requests: write
  contents: write

jobs:
  enable:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-latest
    env:
      DEPENDABOT_AUTOMERGE_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
    steps:
      - name: Validate PAT
        id: patcheck
        shell: bash
        run: |
          if [ -z "$DEPENDABOT_AUTOMERGE_TOKEN" ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "DEPENDABOT_AUTOMERGE_TOKEN no definido" >&2
            exit 1
          fi
          user_code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $DEPENDABOT_AUTOMERGE_TOKEN" https://api.github.com/user)
          repo_code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $DEPENDABOT_AUTOMERGE_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}")
          if [ "$user_code" = "200" ] && [ "$repo_code" = "200" ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "DEPENDABOT_AUTOMERGE_TOKEN inválido o sin acceso al repo" >&2
            exit 1
          fi
      - name: Token path (diagnostic)
        run: echo "Using DEPENDABOT_AUTOMERGE_TOKEN (PAT) for auto-merge"
      - name: Check PR checks status
        id: checks
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request.head.sha
            const res = await github.rest.checks.listForRef({ owner: context.repo.owner, repo: context.repo.repo, ref: sha })
            const failing = res.data.check_runs.filter(cr => ['failure','cancelled','timed_out','action_required'].includes(cr.conclusion))
            core.setOutput('ok', failing.length === 0 ? 'true' : 'false')

      - name: Enable Auto-Merge (PAT)
        if: ${{ steps.checks.outputs.ok == 'true' && steps.patcheck.outputs.valid == 'true' }}
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ env.DEPENDABOT_AUTOMERGE_TOKEN }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
