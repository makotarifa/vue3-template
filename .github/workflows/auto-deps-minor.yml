name: Auto Minor Dependency Updates

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: auto-deps-minor
      cancel-in-progress: true
    env:
      DEPENDABOT_AUTOMERGE_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Read pnpm version from package.json
        id: read-package-manager
        run: |
          echo pnpm_version=$(node -e 'const pm=require("./package.json").packageManager||"pnpm@10.25.0"; console.log(pm.split("@")[1]);') >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.read-package-manager.outputs.pnpm_version }}

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update dependencies (minor/patch per semver)
        run: pnpm update -r

      - name: Reinstall after update
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Ensure labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = ['dependencies', 'automated']
            for (const name of labels) {
              try {
                await github.rest.issues.getLabel({ owner: context.repo.owner, repo: context.repo.repo, name })
              } catch (e) {
                await github.rest.issues.createLabel({ owner: context.repo.owner, repo: context.repo.repo, name, color: 'a2eeef' })
              }
            }

      - name: Validate DEPENDABOT_AUTOMERGE_TOKEN
        id: datoken
        shell: bash
        run: |
          if [ -z "$DEPENDABOT_AUTOMERGE_TOKEN" ]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "DEPENDABOT_AUTOMERGE_TOKEN no definido" >&2
            exit 1
          fi
          user_code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $DEPENDABOT_AUTOMERGE_TOKEN" https://api.github.com/user)
          repo_code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $DEPENDABOT_AUTOMERGE_TOKEN" "https://api.github.com/repos/${GITHUB_REPOSITORY}")
          if [ "$user_code" = "200" ] && [ "$repo_code" = "200" ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "DEPENDABOT_AUTOMERGE_TOKEN inválido o sin acceso al repo" >&2
            exit 1
          fi

      - name: Create Pull Request (DEPENDABOT token obligatorio)
        if: ${{ steps.datoken.outputs.valid == 'true' }}
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ env.DEPENDABOT_AUTOMERGE_TOKEN }}
          branch: chore/auto-deps-minor
          title: 'chore(deps): auto minor/patch updates'
          commit-message: 'chore(deps): auto minor/patch updates via pnpm update'
          add-paths: |
            pnpm-lock.yaml
            package.json
          body: |
            Actualización automática de dependencias a versiones minor/patch compatibles según rangos semver definidos en `package.json`.
            La pipeline ejecuta `lint`, `typecheck`, `build` y pruebas E2E para garantizar que no se rompa nada.
          labels: dependencies, automated
          signoff: true
          delete-branch: true

      - name: Enable GitHub Auto-Merge on PR (DEPENDABOT token)
        if: ${{ steps.cpr.outputs.pull-request-number && success() && steps.datoken.outputs.valid == 'true' }}
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ env.DEPENDABOT_AUTOMERGE_TOKEN }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash
