name: Dependabot Auto Merge

on:
  pull_request:

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
      checks: read
      statuses: read
    steps:
      - name: Validate token
        id: token
        env:
          PAT: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
        run: |
          if [ -z "$PAT" ]; then
            echo "DEPENDABOT_AUTOMERGE_TOKEN no definido" >&2
            exit 1
          fi
      - name: Wait for checks to pass
        id: waitchecks
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const sha = context.payload.pull_request.head.sha
            const maxTries = 30
            const sleepMs = 10000
            for (let i = 0; i < maxTries; i++) {
              const checks = await github.rest.checks.listForRef({ owner, repo, ref: sha })
              const runs = checks.data.check_runs
              const failed = runs.filter(cr => ['failure','cancelled','timed_out','action_required','startup_failure'].includes(cr.conclusion))
              if (failed.length > 0) {
                core.setOutput('ready', 'false')
                return
              }
              const pending = runs.filter(cr => cr.status !== 'completed' && !cr.name.includes('Dependabot Auto Merge') && !cr.name.includes('automerge'))
              const statuses = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha })
              const state = statuses.data.state // success | failure | pending
              if (state === 'failure') {
                core.setOutput('ready', 'false')
                return
              }
              // Si no hay pendientes externos y el estado es success (o pending solo por nosotros)
              if (pending.length === 0) {
                core.setOutput('ready', 'true')
                return
              }
              if (runs.length === 0 && (statuses.data.statuses ?? []).length === 0) {
                core.setOutput('ready', 'true')
                return
              }
              await new Promise(r => setTimeout(r, sleepMs))
            }
            core.setOutput('ready', 'false')
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Auto-merge PR
        if: ${{ steps.waitchecks.outputs.ready == 'true' && (steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch') }}
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --squash
